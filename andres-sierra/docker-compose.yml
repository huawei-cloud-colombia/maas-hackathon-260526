services:
  app:
    build: .
    container_name: hackathon-maas-app
    ports:
      - "8580:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - MAAS_BASE_URL=${MAAS_BASE_URL:-https://api-ap-southeast-1.modelarts-maas.com/v2}
      - MAAS_API_KEY=${MAAS_API_KEY:-}
      - MAAS_MODEL=${MAAS_MODEL:-deepseek-v3.2}
      - MAAS_TIMEOUT=${MAAS_TIMEOUT:-15}
      - FECHA_EVALUACION=${FECHA_EVALUACION:-}
      - FLASK_PORT=8080
    volumes:
      - ./codigo/data:/app/codigo/data
    restart: unless-stopped
