<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BecaMatch AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-icon"><i class="bi bi-lightning-charge-fill"></i></span>
                <span class="brand-text">BecaMatch<span class="brand-ai">AI</span></span>
            </a>
            <div class="navbar-right d-flex align-items-center gap-2">
                <span class="nav-badge">
                    <span class="pulse-dot"></span>
                    Huawei MaaS
                </span>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <div class="footer-inner">
                <span class="footer-brand"><i class="bi bi-lightning-charge-fill me-1"></i>BecaMatch AI</span>
                <span class="footer-sep">|</span>
                <span>Hackat&oacute;n Huawei Cloud MaaS 2026</span>
                <span class="footer-sep">|</span>
                <span class="footer-tech">DeepSeek + GLM-5.1</span>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
